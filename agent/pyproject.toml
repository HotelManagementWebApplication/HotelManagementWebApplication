[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "web-hotel-mis-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.7,<3.0"
]

[project.scripts]
index-customer-policy = "rag.indexing:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "app*", "rag*", "tools*", "policies*", "providers*"]
