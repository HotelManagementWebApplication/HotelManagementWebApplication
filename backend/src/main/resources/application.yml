spring:
  application:
    name: web-hotel-mis-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/QLKS?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:hotel_mis_local}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

hotel:
  time-zone: ${HOTEL_TIME_ZONE:Asia/Ho_Chi_Minh}
  payment:
    webhook-secret: ${HOTEL_PAYMENT_WEBHOOK_SECRET:}
  booking:
    deposit-hold-minutes: ${HOTEL_DEPOSIT_HOLD_MINUTES:15}
    hold-expiry-scan-ms: ${HOTEL_HOLD_EXPIRY_SCAN_MS:60000}
  public-api:
    requests-per-minute: ${HOTEL_PUBLIC_REQUESTS_PER_MINUTE:120}
  media:
    room-images-dir: ${HOTEL_ROOM_IMAGES_DIR:./data/room-images}
    orphan-grace-minutes: ${HOTEL_MEDIA_ORPHAN_GRACE_MINUTES:60}
    orphan-cleanup-ms: ${HOTEL_MEDIA_ORPHAN_CLEANUP_MS:3600000}
  policy:
    hourly-minimum: ${HOTEL_HOURLY_MINIMUM:3}
    late-checkout-grace-minutes: ${HOTEL_LATE_GRACE_MINUTES:20}
    vip-discount-percent: ${HOTEL_VIP_DISCOUNT_PERCENT:10}
    vip-stay-threshold: ${HOTEL_VIP_STAY_THRESHOLD:10}

management:
  health:
    # SMTP credentials are optional in local/demo environments. Enable this probe only
    # where MAIL_USERNAME and MAIL_PASSWORD are configured.
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

server:
  # Hosting providers expose their HTTP port through PORT; local development
  # keeps the existing 8080 default.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Cơ sở dữ liệu và bảo mật đang được kích hoạt; sử dụng biến môi trường cho các giá trị tùy theo môi trường.
# Không bao giờ commit thông tin xác thực tại đây; hãy sử dụng biến môi trường hoặc trình quản lý bí mật.
