spring:
  application:
    name: web-hotel-mis-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QLKS;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:${MSSQL_SA_PASSWORD:Hotel_Mis_SqlServer_2026!}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        use_nationalized_character_data: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:minhtuyen220706@gmail.com} # 2 dòng này bắt buộc không được xóa không được đụng vào
    password: ${MAIL_PASSWORD:hwza uavr czqh madl} # 2 dòng này bắt buộc không được xóa không được đụng vào
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

hotel:
  time-zone: ${HOTEL_TIME_ZONE:Asia/Ho_Chi_Minh}
  security:
    jwt-secret: ${JWT_SECRET}
    otp-subject-pepper: ${HOTEL_OTP_SUBJECT_PEPPER:${JWT_SECRET}}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  payment:
    webhook-secret: ${HOTEL_PAYMENT_WEBHOOK_SECRET:}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/public/payments/vnpay/return}
      frontend-result-url: ${VNPAY_FRONTEND_RESULT_URL:http://localhost:5173/payment/vnpay-result}
  booking:
    deposit-hold-minutes: ${HOTEL_DEPOSIT_HOLD_MINUTES:15}
    hold-expiry-scan-ms: ${HOTEL_HOLD_EXPIRY_SCAN_MS:60000}
  public-api:
    requests-per-minute: ${HOTEL_PUBLIC_REQUESTS_PER_MINUTE:120}
  media:
    room-images-dir: ${HOTEL_ROOM_IMAGES_DIR:./data/room-images}
    orphan-grace-minutes: ${HOTEL_MEDIA_ORPHAN_GRACE_MINUTES:60}
    orphan-cleanup-ms: ${HOTEL_MEDIA_ORPHAN_CLEANUP_MS:3600000}
  policy:
    hourly-minimum: ${HOTEL_HOURLY_MINIMUM:3}
    late-checkout-grace-minutes: ${HOTEL_LATE_GRACE_MINUTES:20}
    vip-discount-percent: ${HOTEL_VIP_DISCOUNT_PERCENT:10}
    vip-stay-threshold: ${HOTEL_VIP_STAY_THRESHOLD:10}

management:
  health:
    # SMTP credentials are optional in local/demo environments. Enable this probe only
    # where MAIL_USERNAME and MAIL_PASSWORD are configured.
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

server:
  # Hosting providers expose their HTTP port through PORT; local development
  # keeps the existing 8080 default.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Cơ sở dữ liệu và bảo mật đang được kích hoạt; sử dụng biến môi trường cho các giá trị tùy theo môi trường.
# Không bao giờ commit thông tin xác thực tại đây; hãy sử dụng biến môi trường hoặc trình quản lý bí mật.
