name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ci-SqlServer-password-2026!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ci-SqlServer-password-2026! -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Recreate clean SQL Server database
        run: |
          cid=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -n 1)
          test -n "$cid"
          docker exec "$cid" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ci-SqlServer-password-2026!' -C -b -Q "IF DB_ID(N'QLKS') IS NOT NULL BEGIN ALTER DATABASE [QLKS] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [QLKS]; END; CREATE DATABASE [QLKS] COLLATE Vietnamese_100_CI_AI;"
      - name: Test with clean SQL Server, Flyway and Hibernate validation
        env:
          MIGRATION_TEST_DB_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=QLKS;encrypt=true;trustServerCertificate=true
          MIGRATION_TEST_DB_USERNAME: sa
          MIGRATION_TEST_DB_PASSWORD: ci-SqlServer-password-2026!
        run: mvn -B test
      - name: Verify every SQL Server proof suite actually ran
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sources = {path.stem for path in Path("src/test/java").rglob("SqlServer*Test.java")}
          reports = {}
          for path in Path("target/surefire-reports").glob("TEST-*.xml"):
              class_name = path.name.removeprefix("TEST-").removesuffix(".xml").split(".")[-1]
              reports[class_name] = path

          missing = sorted(sources - reports.keys())
          if missing:
              raise SystemExit(f"SQL Server proof suites did not run: {', '.join(missing)}")

          skipped = []
          empty = []
          for name in sorted(sources):
              suite = ET.parse(reports[name]).getroot()
              if int(suite.attrib.get("skipped", "0")):
                  skipped.append(name)
              if int(suite.attrib.get("tests", "0")) == 0:
                  empty.append(name)
          if skipped:
              raise SystemExit(f"SQL Server proof suites were skipped: {', '.join(skipped)}")
          if empty:
              raise SystemExit(f"SQL Server proof suites contained no tests: {', '.join(empty)}")
          print(f"Verified {len(sources)} SQL Server proof suites: all ran with zero skips.")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
