services:
  sqlserver:
    container_name: web-hotel-mis-sqlserver-1433
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Hotel_Mis_SqlServer_2026!}
      MSSQL_PID: Developer
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "1433:1433"
    volumes:
      - hotel-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Hotel_Mis_SqlServer_2026!}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID(N'QLKS') IS NULL CREATE DATABASE [QLKS] COLLATE Vietnamese_100_CI_AI;"

  qdrant:
    container_name: web-hotel-mis-qdrant
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - hotel-qdrant:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - >-
          set -e;
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$${status}" =~ ^HTTP/[0-9.]+[[:space:]]200([[:space:]]|$$) ]]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  agent:
    container_name: web-hotel-mis-agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    env_file:
      - agent/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      BACKEND_API_BASE_URL: http://host.docker.internal:8080
      AGENT_PORT: 8090
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  hotel-sqlserver:
    name: web-hotel-mis_hotel-sqlserver
  hotel-qdrant:
    name: web-hotel-mis_hotel-qdrant
